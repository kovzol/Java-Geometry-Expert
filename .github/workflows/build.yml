name: build

on: [push]

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: 'gradle'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y gettext

    - name: Build
      run: ./gradlew package
