name: Build Web package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web Distribution
    runs-on: ubuntu-22.04

    env:
      APP_NAME: Java-Geometry-Expert

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          if [[ -z "$VERSION" || "$VERSION" == "refs/heads/"* ]]; then
            VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
            VERSION="${VERSION#v}"
          fi

          VERSION="${VERSION//_/-}"

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext zip

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Web distribution
        run: |
          ./gradlew --no-daemon clean buildWeb \
            "-PsoftwareVersion=${{ steps.version.outputs.value }}"

      - name: Package web distribution into zip
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          if [ ! -d "build/web-dist" ]; then
            echo "Directory build/web-dist not found!"
            exit 1
          fi

          mkdir -p dist

          # Package contents of build/web-dist without including the root folder name
          ZIP_NAME="${APP_NAME}-${VERSION}-web.zip"
          (cd build/web-dist && zip -r "../../dist/${ZIP_NAME}" ./*)

          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/*
          if-no-files-found: error

      - name: Upload package to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --notes "Release $TAG"
          gh release upload "$TAG" dist/* --clobber